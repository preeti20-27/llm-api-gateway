server:
  port: 8080

spring:
  application:
    name: llm-api-gateway
  threads:
    virtual:
      enabled: true # Java 21 virtual threads for request handling (Tomcat)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/llm_gateway}
    username: ${DB_USERNAME:llm_gateway}
    password: ${DB_PASSWORD:llm_gateway}
  jpa:
    open-in-view: false # avoids the open-session-in-view anti-pattern; see Phase 2 write-up
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, never by Hibernate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

admin:
  token: ${ADMIN_TOKEN:}

# Token-bucket capacity per tier. Operational tuning, not a secret — plain YAML,
# not env-driven. See RateLimitProperties / the Phase 3 write-up for the algorithm.
rate-limit:
  free:
    capacity: 10
    window-seconds: 60
  pro:
    capacity: 100
    window-seconds: 60

# How long a cached chat response stays valid. Also plain YAML — see the Phase 4
# write-up for why TTL expiry, not explicit invalidation, is the right call here.
cache:
  ttl-seconds: 300

# Estimated cost, one blended rate per provider — see PricingProperties for why
# "estimated". gemini-1.5-flash's real per-token price as of writing; update if it
# changes, this isn't fetched live.
pricing:
  cost-per-thousand-tokens:
    gemini: 0.00025

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  model: ${GEMINI_MODEL:gemini-1.5-flash}

logging:
  level:
    com.llmgateway: INFO
