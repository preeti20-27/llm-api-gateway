server:
  port: 8080

spring:
  application:
    name: llm-api-gateway
  threads:
    virtual:
      enabled: true # Java 21 virtual threads for request handling (Tomcat)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/llm_gateway}
    username: ${DB_USERNAME:llm_gateway}
    password: ${DB_PASSWORD:llm_gateway}
  jpa:
    open-in-view: false # avoids the open-session-in-view anti-pattern; see Phase 2 write-up
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, never by Hibernate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

admin:
  token: ${ADMIN_TOKEN:}

# Token-bucket capacity per tier. Operational tuning, not a secret — plain YAML,
# not env-driven. See RateLimitProperties / the Phase 3 write-up for the algorithm.
rate-limit:
  free:
    capacity: 10
    window-seconds: 60
  pro:
    capacity: 100
    window-seconds: 60

# How long a cached chat response stays valid. Also plain YAML — see the Phase 4
# write-up for why TTL expiry, not explicit invalidation, is the right call here.
cache:
  ttl-seconds: 300

# Estimated cost, one blended rate per provider — see PricingProperties for why
# "estimated". gemini-1.5-flash's real per-token price as of writing; update if it
# changes, this isn't fetched live.
pricing:
  cost-per-thousand-tokens:
    gemini: 0.00025
    ollama: 0.0 # local model — no per-token charge

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  model: ${GEMINI_MODEL:gemini-1.5-flash}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2}

# Circuit breaker + retry + timeout around the primary (Gemini) provider — see
# FailoverLlmProvider and the Phase 5 write-up for what each threshold means and how
# to tune them. Plain YAML: operational tuning, not a secret.
resilience4j:
  circuitbreaker:
    instances:
      gemini:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10          # evaluate the last 10 calls
        minimum-number-of-calls: 5       # need at least 5 before computing a failure rate at all
        failure-rate-threshold: 50       # >=50% of those failing trips the breaker OPEN
        wait-duration-in-open-state: 30s # stay OPEN (fail fast to Ollama) this long before probing again
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      gemini:
        max-attempts: 3
        wait-duration: 500ms
  timelimiter:
    instances:
      gemini:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        # Explicit allowlist, not "*": /actuator/env, /actuator/beans etc. can leak
        # config values (including secrets) or internals. health/info/metrics/
        # prometheus is exactly what monitoring infra needs and nothing more.
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always # fine for this project's scope; see SecurityConfig's note on actuator exposure
  health:
    circuitbreakers:
      enabled: true # surfaces the "gemini" circuit breaker's state on /actuator/health

logging:
  level:
    com.llmgateway: INFO
