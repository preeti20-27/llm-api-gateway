# One-command local stack: the app itself (built from ./Dockerfile), Postgres,
# Redis, Prometheus and Grafana. `docker compose up -d --build` is the whole setup.
#
# For active development (hot-reload, debugging in an IDE) run just the
# infrastructure — `docker compose up -d postgres redis prometheus grafana` — and
# the app separately via `./mvnw spring-boot:run` on the host instead; see the
# README's "Running locally for development" section.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Overrides the host/port-style values .env.example sets for running the app
      # directly on the host via mvnw — inside this compose network, services
      # address each other by service name, not localhost.
      DB_URL: jdbc:postgresql://postgres:5432/llm_gateway
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      # So the containerized app can still reach a locally installed Ollama (which
      # runs on the host, not in this compose network) if OLLAMA_BASE_URL in .env
      # points at host.docker.internal.
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llm_gateway
      POSTGRES_USER: llm_gateway
      POSTGRES_PASSWORD: llm_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.5
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      # Only needed for the host.docker.internal scrape target in prometheus.yml —
      # covers the "app run via mvnw on the host" case. See that file's comment.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "3000:3000"
    environment:
      # Local dev only — not a real secret, never used outside this compose file.
      # Anonymous viewer access is on too, so the dashboard opens with no login step.
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
