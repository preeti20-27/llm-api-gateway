global:
  scrape_interval: 15s

scrape_configs:
  - job_name: llm-api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      # The app runs on the host, not in this compose network — see docker-compose.yml's
      # extra_hosts entry for why host.docker.internal resolves here.
      - targets: ["host.docker.internal:8080"]
